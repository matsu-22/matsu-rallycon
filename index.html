<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matsu RallyCon">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Matsu RallyCon v0.3.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;overflow:hidden;font-family:Arial,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));gap:6px;overflow:hidden}
.top{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;align-items:center;min-height:30px;font:700 13px monospace;text-align:center;min-width:0}.top span{min-width:0;white-space:nowrap;overflow:hidden}
.top span:first-child{text-align:left}.top span:last-child{text-align:right}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(150px,22%) minmax(0,1fr) minmax(175px,22%);gap:7px;overflow:hidden}
.panel{border:1px solid #555;border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:space-around;min-width:0}
.metric{text-align:center}.label{font:700 13px monospace;color:#bbb}
.value{font:700 clamp(22px,4vw,34px) monospace;white-space:nowrap;overflow:hidden;text-overflow:clip}
#time{font-size:clamp(18px,3vw,30px);letter-spacing:-1px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #777;border-radius:10px;position:relative;min-width:0}
.rbhead{position:absolute;top:7px;left:10px;right:10px;display:flex;justify-content:space-between;font:700 15px monospace}
.arrow{font:700 min(24vw,150px)/1 Arial;text-align:center;margin-top:5px}
.rbtext{font:700 clamp(18px,3vw,30px) monospace}
.warning{font:700 15px monospace;min-height:20px}
.remaining{font:700 clamp(14px,2.3vw,22px) monospace;margin-top:5px}
button{color:#fff;background:#101010;border:1px solid #777;border-radius:8px;min-height:46px;font:700 16px Arial;padding:6px 10px}
button:active{background:#444}
.bottom{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;min-height:52px;min-width:0}.bottom button{min-width:0;white-space:nowrap}
.small,.status{font:700 12px monospace}
.status{text-align:center}
@media(max-width:700px) and (orientation:portrait){
body:before{content:"iPhoneを横向きにしてください";position:fixed;inset:0;z-index:99;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold}
.top,.main,.bottom{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span id="gps">GPS --m</span>
    <span id="cap">CAP ---°</span>
    <span id="headingMode">GPS-CAP</span>
    <span>Matsu RallyCon v0.3.1 SAFE</span>
  </div>

  <div class="main">
    <section class="panel">
      <div class="metric"><div class="label">TOTAL</div><div class="value" id="total">0.00</div><div class="small">km</div></div>
      <div class="metric"><div class="label">LEG</div><div class="value" id="leg">0.00</div><div class="small">km</div></div>
      <div class="metric"><div class="label">SPEED</div><div class="value" id="speed">0.0</div><div class="small">km/h</div></div>
    </section>

    <section class="center">
      <div class="rbhead"><span>ROADBOOK <span id="rbno">1</span></span><span id="target">0.00 km</span></div>
      <div class="arrow" id="arrow">↗</div>
      <div class="rbtext" id="rbtext">START</div>
      <div class="warning" id="warning"></div>
      <div class="remaining" id="remaining">NEXTまで 0.00 km</div>
    </section>

    <section class="panel">
      <div class="metric"><div class="label">TIME</div><div class="value" id="time">00:00:00</div></div>
      <button id="start">START</button>
      <button id="next">NEXT</button>
      <div class="status" id="status">GPS待機中</div>
    </section>
  </div>

  <div class="bottom">
    <button id="minus">−10m</button>
    <button id="reset">0 RESET</button>
    <button id="plus">+10m</button>
    <button id="gpsbtn">GPS START</button>
    <button id="compass">🧭 CAP</button>
    <button id="cal">CAP 0°</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

let watchId=null,last=null,total=0,correction=0,legBase=0;
let timerStart=null,elapsed=0,rb=1, sensorHeading=null, capOffset=0;
let lastAutoNext=0;

const roadbook=[
 {no:1,dist:0.00,arrow:"↗",text:"START",warn:""},
 {no:2,dist:0.85,arrow:"→",text:"右",warn:""},
 {no:3,dist:1.42,arrow:"←",text:"左",warn:"注意：急カーブ"},
 {no:4,dist:2.13,arrow:"→",text:"右",warn:""},
 {no:5,dist:3.00,arrow:"↑",text:"直進",warn:"CP"},
 {no:6,dist:4.25,arrow:"↖",text:"左前",warn:""}
];

function displayTotal(){return (total+correction)/1000}
function displayLeg(){return Math.max(0,displayTotal()-legBase)}
function update(){
  $("total").textContent=displayTotal().toFixed(2);
  $("leg").textContent=displayLeg().toFixed(2);
  $("gpsbtn").textContent=watchId!==null?"GPS STOP":"GPS START";
  const target=roadbook[rb-1].dist;
  $("target").textContent=target.toFixed(2)+" km";
  const remain=Math.max(0,target-displayTotal());
  $("remaining").textContent="NEXTまで "+remain.toFixed(2)+" km";
}
function setRB(n){
  rb=Math.max(1,Math.min(roadbook.length,n));
  const r=roadbook[rb-1];
  $("rbno").textContent=r.no;$("arrow").textContent=r.arrow;$("rbtext").textContent=r.text;$("warning").textContent=r.warn;
  update();
}
function dist(a,b){
  const R=6371000,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lon-a.lon)*p;
  const x=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function setCap(deg,mode){
  if(!Number.isFinite(deg)) return;
  let d=(deg+capOffset+360)%360;
  $("cap").textContent="CAP "+String(Math.round(d)).padStart(3,"0")+"°";
  $("headingMode").textContent=mode;
}
function handleOrientation(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number" && Number.isFinite(e.webkitCompassHeading)) h=e.webkitCompassHeading;
  else if(typeof e.alpha==="number" && e.absolute===true) h=(360-e.alpha)%360;
  if(h!==null){sensorHeading=h;setCap(h,"COMPASS")}
}
async function enableCompass(){
  try{
    if(typeof DeviceOrientationEvent==="undefined"){ $("status").textContent="コンパス非対応"; return; }
    if(typeof DeviceOrientationEvent.requestPermission==="function"){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=="granted"){ $("status").textContent="CAPセンサー許可が必要"; return; }
    }
    window.addEventListener("deviceorientation",handleOrientation,true);
    $("status").textContent="電子コンパス受信中";
  }catch(e){$("status").textContent="CAPセンサー開始失敗"}
}
function calibrate(){
  let current=null;
  const text=$("cap").textContent.match(/(\d+)/);
  if(text) current=Number(text[1]);
  if(current!==null){capOffset=(360-current)%360;setCap(current,"CALIBRATED");$("status").textContent="CAP 0°補正しました";}
}
function startGPS(){
  if(!navigator.geolocation){$("status").textContent="GPS非対応";return}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords;
    $("gps").textContent=`GPS ${Math.round(c.accuracy||0)}m`;
    if(c.speed!==null && c.speed>=0)$("speed").textContent=(c.speed*3.6).toFixed(1);

    if(sensorHeading===null && c.heading!==null && c.heading>=0) setCap(c.heading,"GPS-CAP");

    const now={lat:c.latitude,lon:c.longitude};
    if(last){
      const d=dist(last,now);
      // Reject obvious GPS jumps while retaining normal rally movement.
      if(d<100) total+=d;
    }
    last=now;
    $("status").textContent="GPS受信中";
    update();

    // Auto NEXT when total reaches the roadbook target, with a small hysteresis.
    if(rb<roadbook.length){
      const remain=roadbook[rb].dist-displayTotal();
      if(remain<=0.015 && displayTotal()>lastAutoNext+0.02){
        lastAutoNext=displayTotal();
        rb++;
        legBase=displayTotal();
        setRB(rb);
      }
    }
  },e=>$("status").textContent="GPSエラー "+e.code,
  {enableHighAccuracy:true,maximumAge:0,timeout:10000});
  update();
}
function stopGPS(){
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=null;last=null;update();
}
function tm(s){
  let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return[h,m,x].map(v=>String(v).padStart(2,"0")).join(":");
}
async function wake(){
  try{if("wakeLock"in navigator)await navigator.wakeLock.request("screen")}catch(e){}
}

$("gpsbtn").onclick=()=>watchId===null?startGPS():stopGPS();
$("minus").onclick=()=>{correction-=10;update()};
$("plus").onclick=()=>{correction+=10;update()};
$("reset").onclick=()=>{correction=0;total=0;legBase=0;last=null;lastAutoNext=0;setRB(1);update()};
$("next").onclick=()=>{if(rb<roadbook.length){rb++;legBase=displayTotal();lastAutoNext=displayTotal();setRB(rb)}};
$("start").onclick=()=>{
  if(timerStart===null){timerStart=Date.now()-elapsed*1000;$("start").textContent="STOP";wake()}
  else{elapsed=Math.floor((Date.now()-timerStart)/1000);timerStart=null;$("start").textContent="START"}
};
$("compass").onclick=enableCompass;
$("cal").onclick=calibrate;

setInterval(()=>{
  if(timerStart!==null){elapsed=Math.floor((Date.now()-timerStart)/1000);$("time").textContent=tm(elapsed)}
},250);

setRB(1);update();
</script>
</body>
</html>
